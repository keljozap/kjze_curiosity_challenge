name: QA Quality Gate CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: 1️⃣ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 2️⃣ Build
        run: |
          npm install
          npm run build

      - name: 3️⃣ Pruebas unitarias
        run: npm test

      - name: 4️⃣ Cobertura
        run: npm run test:coverage

      - name: 5️⃣ Mutation Testing
        run: npm run test:mutation

      - name: 6️⃣ Pruebas Karate
        run: |
          # Levantar la API compilada en background y esperar que responda
          npm start &
          sleep 5
          
          # Descargar Karate
          curl -L -o karate.jar https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar
          
          # Ejecutar Karate mediante Docker
          docker run --rm --add-host host.docker.internal:host-gateway -v "${{ github.workspace }}:/app" -w /app eclipse-temurin:17-jre java -jar karate.jar tests/karate/api/orders.feature

      - name: 7️⃣ Construcción de imagen Docker
        run: docker compose build

  e2e-tests:
    name: Frontend & E2E Tests
    runs-on: ubuntu-latest
    # Las pruebas de backend primero deben correr
    needs: [backend-tests] 

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🐳 Levantar Backend (API) con Docker Compose
        run: docker compose up -d
        
      - name: ⏳ Esperar a que la API esté lista
        # Usamos un pequeño script para asegurar que el puerto 8080 responde antes de seguir
        run: |
          while ! curl -s http://localhost:8080/orders > /dev/null; do
            echo "Esperando al backend..."
            sleep 2
          done
          echo "¡Backend listo!"

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Instalar dependencias del Frontend
        working-directory: ./frontend-orders
        run: npm ci

      - name: 🎭 Instalar navegadores de Playwright
        working-directory: ./frontend-orders
        run: npx playwright install --with-deps

      - name: 🚀 Ejecutar pruebas E2E
        working-directory: ./frontend-orders
        run: npx playwright test

      - name: 📊 Subir reporte de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend-orders/playwright-report/
          retention-days: 7